name: Release image

# Publishes a multi-arch image to GitHub Container Registry on a version tag.
# Nothing is pushed on ordinary commits — CI's `image` job already proves the
# Dockerfile builds on every push without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # needed to create the GitHub Release
  packages: write
  id-token: write      # OIDC token used by Sigstore to sign the attestation
  attestations: write  # write the build-provenance attestation to the repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation, which is slow but keeps this to one
      # runner. Swap to a native arm64 runner if the build time becomes annoying.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # flavor.latest defaults to "auto", which tags a non-prerelease
          # semver build as :latest in addition to the versions below.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The final image stage is `FROM scratch` containing only the binary, so
      # buildx can emit it straight to disk. This reuses the cached build above,
      # which means the released binary is byte-identical to the one in the
      # image rather than a second build that could drift from it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=extracted

      - name: Name the binaries and checksum them
        run: |
          set -euo pipefail
          find extracted -type f -printf '%p  %s bytes\n'
          # Locate by path rather than assuming buildx's layout, and fail loudly
          # if either architecture is missing instead of shipping a partial release.
          amd=$(find extracted -type f -name deadair -path '*amd64*' | head -1)
          arm=$(find extracted -type f -name deadair -path '*arm64*' | head -1)
          [ -n "$amd" ] || { echo "::error::amd64 binary not found in extracted/"; exit 1; }
          [ -n "$arm" ] || { echo "::error::arm64 binary not found in extracted/"; exit 1; }
          mkdir -p release
          cp "$amd" release/deadair-x86_64-unknown-linux-musl
          cp "$arm" release/deadair-aarch64-unknown-linux-musl
          chmod +x release/deadair-*
          cd release
          sha256sum deadair-* > SHA256SUMS
          cat SHA256SUMS
          file deadair-*

      - name: Attest build provenance
        # Sigstore-backed, verifiable link from each released binary to this
        # exact workflow run and commit — complements SHA256SUMS. Verify with:
        #   gh attestation verify <file> -R peiralabs/deadair
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/deadair-x86_64-unknown-linux-musl
            release/deadair-aarch64-unknown-linux-musl

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/deadair-x86_64-unknown-linux-musl \
            release/deadair-aarch64-unknown-linux-musl \
            release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
