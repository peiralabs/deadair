name: CI

on:
  push:
  pull_request:

# Both jobs only read the repository. Stating this explicitly rather than
# inheriting the org default means the token stays read-only even if that
# default is ever widened.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the static musl build and the scratch image actually work.
      - run: docker build -t deadair:ci .
      - run: docker run --rm deadair:ci --help
