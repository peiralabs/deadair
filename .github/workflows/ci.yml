name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Proves the static musl build and the scratch image actually work.
      - run: docker build -t deadair:ci .
      - run: docker run --rm deadair:ci --help
