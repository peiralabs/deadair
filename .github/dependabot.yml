version: 2
updates:
  # Keeps the action versions in the workflows current. GitHub's own published
  # example pins older majors than the actions actually ship, so this is worth
  # automating rather than trusting a docs page.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # One PR for the whole tree rather than a PR per crate. The dependency
      # set is small and almost entirely the rustls stack, which moves together.
      all-dependencies:
        patterns: ['*']
