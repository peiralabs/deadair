[package]
name = "deadair"
version = "0.1.0"
edition = "2024"
description = "Verify that a gluetun and qBittorrent stack is actually alive"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/peiralabs/deadair"
keywords = ["gluetun", "qbittorrent", "vpn", "monitoring"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
